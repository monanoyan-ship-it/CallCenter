<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call Center</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="CallCenter.Web.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Chart.js - Grafik kutuphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <!-- Chart.js Blazor Interop -->
    <script src="js/chartInterop.js"></script>
    <!-- SIP.js - WebRTC SIP client -->
    <script src="https://cdn.jsdelivr.net/npm/sip.js@0.21.2/dist/sip.min.js"></script>
    <!-- SIP client wrapper (Blazor JS Interop) -->
    <script src="js/sipClient.js"></script>
    <!-- Audio Player (kayit dinleme) -->
    <script src="js/audioPlayer.js"></script>
    <!-- Gizli audio elementi: Uzak tarafin sesi buradan calinir -->
    <audio id="remoteAudio" autoplay></audio>
    <!-- Video elementleri: Gorunurluk Blazor tarafindan kontrol edilir -->
    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
    <video id="localVideo" autoplay playsinline muted style="display:none;"></video>

    <script>
        // Blazor JS Interop: byte[] -> dosya indirme
        function downloadFile(fileName, contentType, byteArray) {
            var blob = new Blob([new Uint8Array(byteArray)], { type: contentType });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>

# ============================================================
# CallCenter Web — Nginx Konfigurasyonu
# ============================================================
# - Blazor WASM statik dosyalari serve eder
# - /api/ ve /hubs/ isteklerini API container'a proxy yapar
# - SPA fallback: bilinmeyen route'lar index.html'e yonlendirilir
# ============================================================

server {
    listen 80;
    server_name _;

    # Blazor WASM dosyalari
    root /usr/share/nginx/html;
    index index.html;

    # Gzip sikistirma (Blazor WASM .dll dosyalari buyuk olabilir)
    gzip on;
    gzip_types application/octet-stream application/wasm application/javascript text/css text/html application/json;
    gzip_min_length 256;

    # --- API Reverse Proxy ---
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buyuk request body (dosya yukleme vs.)
        client_max_body_size 50m;
    }

    # --- SignalR WebSocket Proxy ---
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SignalR icin uzun timeout (varsayilan 60s yetersiz)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- OpenAPI/Swagger Proxy ---
    location /openapi/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- Blazor WASM SPA Fallback ---
    # Blazor routing: bilinmeyen path'ler index.html'e duser
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Blazor framework dosyalari icin cache
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
